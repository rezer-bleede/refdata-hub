<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="hub-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="hub-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="hub-grad-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <filter id="hub-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background Container -->
  <rect width="512" height="512" rx="72" fill="url(#hub-bg)" />
  <rect width="512" height="512" rx="72" fill="none" stroke="url(#hub-grad-primary)" stroke-width="3" stroke-opacity="0.3" />

  <!-- Outer Interconnected Data Hub Symbol -->
  <g transform="translate(136, 96)">
    <!-- Node Connection Network Rays -->
    <path d="M120 40 L120 120" stroke="url(#hub-grad-accent)" stroke-width="4" stroke-dasharray="6 6" opacity="0.6"/>
    <path d="M120 120 L40 180" stroke="url(#hub-grad-accent)" stroke-width="4" opacity="0.5"/>
    <path d="M120 120 L200 180" stroke="url(#hub-grad-accent)" stroke-width="4" opacity="0.5"/>
    <path d="M40 180 L200 180" stroke="url(#hub-grad-primary)" stroke-width="3" opacity="0.4"/>

    <!-- Central Hub Prism Core -->
    <path d="M120 45 L190 85 L190 165 L120 205 L50 165 L50 85 Z"
          fill="none" stroke="url(#hub-grad-primary)" stroke-width="8" stroke-linejoin="round" filter="url(#hub-glow)"/>

    <!-- Inner Core Hexagon -->
    <path d="M120 75 L165 100 L165 150 L120 175 L75 150 L75 100 Z"
          fill="url(#hub-grad-primary)" opacity="0.25"/>

    <!-- Data Exchange Nodes (Glowing Orbs) -->
    <circle cx="120" cy="45" r="10" fill="#22d3ee" filter="url(#hub-glow)"/>
    <circle cx="190" cy="85" r="8" fill="#6366f1"/>
    <circle cx="190" cy="165" r="8" fill="#a855f7"/>
    <circle cx="120" cy="205" r="10" fill="#38bdf8" filter="url(#hub-glow)"/>
    <circle cx="50" cy="165" r="8" fill="#6366f1"/>
    <circle cx="50" cy="85" r="8" fill="#22d3ee"/>

    <!-- Center Pulse Node -->
    <circle cx="120" cy="125" r="14" fill="url(#hub-grad-accent)" filter="url(#hub-glow)"/>
    <circle cx="120" cy="125" r="6" fill="#ffffff"/>
  </g>

  <!-- RefData Hub Branding Text -->
  <text x="256" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="-0.5">
    RefData <tspan fill="#38bdf8">Hub</tspan>
  </text>
  <text x="256" y="452" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="4">
    REFERENCE DATA HARMONIZATION
  </text>
</svg>