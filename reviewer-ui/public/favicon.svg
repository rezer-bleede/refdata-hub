<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="fav-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#fav-bg)" />
  <rect width="64" height="64" rx="16" fill="none" stroke="url(#fav-grad)" stroke-width="2" opacity="0.6"/>

  <!-- Core Prism Shape -->
  <path d="M32 10 L50 20 L50 42 L32 52 L14 42 L14 20 Z"
        fill="url(#fav-grad)" fill-opacity="0.2"
        stroke="url(#fav-grad)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Inner Connections -->
  <path d="M32 10 L32 31 M50 42 L32 31 M14 42 L32 31" stroke="#38bdf8" stroke-width="1.8" opacity="0.8"/>

  <!-- Glowing Nodes -->
  <circle cx="32" cy="10" r="3" fill="#22d3ee" filter="url(#fav-glow)"/>
  <circle cx="50" cy="20" r="2.5" fill="#6366f1"/>
  <circle cx="50" cy="42" r="2.5" fill="#a855f7"/>
  <circle cx="32" cy="52" r="3" fill="#38bdf8" filter="url(#fav-glow)"/>
  <circle cx="14" cy="42" r="2.5" fill="#6366f1"/>
  <circle cx="14" cy="20" r="2.5" fill="#22d3ee"/>

  <!-- Center Node -->
  <circle cx="32" cy="31" r="4" fill="#38bdf8" filter="url(#fav-glow)"/>
  <circle cx="32" cy="31" r="1.5" fill="#ffffff"/>
</svg>